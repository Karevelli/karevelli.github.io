---
layout: default
---
{%- assign t = site.data.i18n[page.lang] -%}
<article class="project">
    <header class="project-header">
        <h1>{{ page.title }}</h1>
        {%- if page.year %}
        <p class="project-year">{{ page.year }}</p>
        {%- endif %}
    </header>
    <div class="project-content">
        {{ content }}
    </div>
    <p class="rights-notice">{{ t.project.rights | replace: '%author%', site.author.name }}</p>
    <p class="back"><a href="{% include localized-url.html url='/projects/' %}">{{ t.projects.back }}</a></p>
</article>
